<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Захвати рынок или закрой бизнес — Табло</title>
  <link rel="stylesheet" href="tablo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>

  <header class="tablo-header">
    <div class="tablo-title">Захвати рынок или закрой бизнес</div>
    <div class="tablo-round" id="t-round">Месяц —</div>
  </header>

  <div id="t-timer" class="tablo-timer hidden">05:00</div>

  <nav class="tablo-tabs">
    <button class="tab-btn active" data-metric="profit">Прибыль по месяцам</button>
    <button class="tab-btn" data-metric="cash">Капитал по месяцам</button>
    <button class="tab-btn" data-metric="marketSharePct">Доля рынка по месяцам</button>
    <button class="tab-btn" data-metric="served">Клиенты по месяцам</button>
    <button class="tab-btn" data-metric="marketing" id="marketing-tab-btn">Маркетинг (таблица)</button>
  </nav>

  <main class="tablo-chart-wrap">
    <canvas id="tablo-chart"></canvas>
    <div id="tablo-marketing-table" class="tablo-marketing-wrap hidden"></div>
  </main>

  <div id="tablo-techinfo" class="tablo-techinfo hidden"></div>

  <div id="tablo-empty" class="tablo-empty hidden">
    Пока нет данных — табло обновится, как только будет рассчитан первый месяц.
  </div>

  <script src="tablo.js"></script>
</body>
</html>
